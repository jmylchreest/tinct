# ============================================================================
# ARCHIVES
# ============================================================================
# Archive configuration
archives:
  - id: tinct-archive
    ids:
      - tinct
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

    files:
      - README.md
      - LICENSE
      - docs/**/*
      - completions/*

  # Repository manager tool archive
  - id: tinct-repo-manager-archive
    ids:
      - tinct-repo-manager
    name_template: >-
      tinct-repo-manager_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

    files:
      - src: contrib/repository/README.md
        dst: README.md
      - src: LICENSE
        dst: LICENSE

  # Plugin archives - separate downloadable packages
