# GoReleaser configuration for Tinct
# https://goreleaser.com/customization/

version: 2

# Environment variables with defaults (overridden by CI secrets).
env:
  - TINCT_TELEMETRY_APP_KEY={{ if index .Env "TINCT_TELEMETRY_APP_KEY" }}{{ .Env.TINCT_TELEMETRY_APP_KEY }}{{ end }}
  - TINCT_TELEMETRY_SERVER_URL={{ if index .Env "TINCT_TELEMETRY_SERVER_URL" }}{{ .Env.TINCT_TELEMETRY_SERVER_URL }}{{ end }}

# Project metadata
project_name: tinct

# Before hooks - run before building
before:
  hooks:
    # Ensure dependencies are up to date
    - go mod tidy
    # Prepare plugin dependencies
    - bash scripts/prepare-plugins.sh
    # Generate shell completions
    - bash scripts/generate-completions.sh
    # Run tests before building (linting happens separately in CI)
    - go test ./...

# ============================================================================
# BUILD CONFIGURATION
# ============================================================================
# Build configuration
builds:
  - id: tinct
    main: ./cmd/tinct
    binary: tinct

    # Build for multiple platforms
    goos:
      - linux
      - freebsd

    goarch:
      - amd64
      - arm64
      - arm

    goarm:
      - "7"

    ignore:
      - goos: freebsd
        goarch: arm

    # Build flags
    env:
      - CGO_ENABLED=0

    flags:
      - -trimpath
      - -mod=mod

    ldflags:
      - -s -w
      - -X github.com/jmylchreest/tinct/internal/version.Version={{.Version}}
      - -X github.com/jmylchreest/tinct/internal/version.Commit={{.Commit}}
      - -X github.com/jmylchreest/tinct/internal/version.Date={{.Date}}
      - -X github.com/jmylchreest/tinct/internal/version.TelemetryAppKey={{ .Env.TINCT_TELEMETRY_APP_KEY }}
      - -X github.com/jmylchreest/tinct/internal/version.TelemetryServerURL={{ .Env.TINCT_TELEMETRY_SERVER_URL }}

    # Ensure we use Go 1.25+
    mod_timestamp: "{{ .CommitTimestamp }}"

  # Repository manager tool
  - id: tinct-repo-manager
    main: ./cmd/tinct-repo-manager
    binary: tinct-repo-manager

    # Build for multiple platforms
    goos:
      - linux
      - darwin
      - freebsd

    goarch:
      - amd64
      - arm64

    # Build flags
    env:
      - CGO_ENABLED=0

    flags:
      - -trimpath
      - -mod=mod

    ldflags:
      - -s -w
      - -X main.version={{.Version}}

    mod_timestamp: "{{ .CommitTimestamp }}"

  # --------------------------------------------------------------------------
  # INPUT PLUGINS
  # --------------------------------------------------------------------------
  # Plugin: random (Go)
  - id: tinct-plugin-random
    main: .
    binary: tinct-plugin-random
    dir: ./contrib/plugins/input/random

    # Build for multiple platforms
    goos:
      - linux
      - freebsd

    goarch:
      - amd64
      - arm64
      - arm

    goarm:
      - "7"

    ignore:
      - goos: freebsd
        goarch: arm

    # Build flags
    env:
      - CGO_ENABLED=0

    flags:
      - -trimpath
      - -mod=mod

    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}

    mod_timestamp: "{{ .CommitTimestamp }}"

  # --------------------------------------------------------------------------
  # OUTPUT PLUGINS
  # --------------------------------------------------------------------------
  # Plugin: wob (Go)
