# ============================================================================
# GITHUB RELEASE
# ============================================================================
# GitHub release
release:
  github:
    owner: jmylchreest
    name: tinct

  draft: false
  # Auto-detect prereleases (versions with -SNAPSHOT, -rc, -alpha, -beta, etc.)
  prerelease: auto
  # Don't mark snapshots as latest, but do mark regular releases as latest
  make_latest: "{{ if .IsSnapshot }}false{{ else }}true{{ end }}"
  # Replace assets for snapshots, append for regular releases
  mode: "{{ if .IsSnapshot }}replace{{ else }}append{{ end }}"

  name_template: "{{.ProjectName}} {{.Tag}}"

  header: |
    ## Tinct {{.Version}}

    **Release Date**: {{.Date}}

    ### Installation

    #### Homebrew (macOS/Linux)
    ```bash
    brew install jmylchreest/tap/tinct
    ```

    #### Download Binary
    Download the appropriate binary for your system from the assets below.

  footer: |
    ---

    **Full Changelog**: https://github.com/jmylchreest/tinct/compare/{{.PreviousTag}}...{{.Tag}}

    ## Plugin Installation

    Plugins are available as separate downloadable archives. Install them using:

    ```bash
    # Install compiled Go plugins
    tinct plugins add https://github.com/jmylchreest/tinct/releases/download/{{.Tag}}/tinct-plugin-random_{{.Version}}_Linux_x86_64.tar.gz:random
    tinct plugins add https://github.com/jmylchreest/tinct/releases/download/{{.Tag}}/tinct-plugin-wob_{{.Version}}_Linux_x86_64.tar.gz:wob-tinct
    tinct plugins add https://github.com/jmylchreest/tinct/releases/download/{{.Tag}}/tinct-plugin-templater_{{.Version}}_Linux_x86_64.tar.gz:templater
    tinct plugins add https://github.com/jmylchreest/tinct/releases/download/{{.Tag}}/tinct-plugin-dunstify_{{.Version}}_Linux_x86_64.tar.gz:dunstify
    tinct plugins add https://github.com/jmylchreest/tinct/releases/download/{{.Tag}}/tinct-plugin-zed_{{.Version}}_Linux_x86_64.tar.gz:zed
    tinct plugins add https://github.com/jmylchreest/tinct/releases/download/{{.Tag}}/tinct-plugin-opencode_{{.Version}}_Linux_x86_64.tar.gz:opencode
    tinct plugins add https://github.com/jmylchreest/tinct/releases/download/{{.Tag}}/tinct-plugin-keylightd-tray_{{.Version}}_Linux_x86_64.tar.gz:keylightd-tray
    ```

    Or download manually from the assets below and add locally:
    ```bash
    tinct plugins add ./random
    tinct plugins add ./wob-tinct
    tinct plugins add ./templater
    tinct plugins add ./dunstify
    tinct plugins add ./zed
    tinct plugins add ./opencode
    tinct plugins add ./keylightd-tray
    ```

    ## What's Next?

    -  [Documentation](https://github.com/jmylchreest/tinct/blob/main/README.md)
    -  [Plugin Development Guide](https://github.com/jmylchreest/tinct/blob/main/contrib/README.md)
    -  [Report Issues](https://github.com/jmylchreest/tinct/issues)
    -  [Discussions](https://github.com/jmylchreest/tinct/discussions)

