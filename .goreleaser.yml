# ============================================================================
# CHECKSUMS & SNAPSHOTS
# ============================================================================
# Checksums
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Snapshots (non-tagged builds)
# Format: v0.1.2-preview.TIMESTAMP+abc1234 (SemVer 2.0 compatible with GitVersion-style ordering)
# Uses timestamp for reliable alphanumeric ordering (newer = higher number)
# Build metadata (+commit) provides traceability but doesn't affect precedence
# Note: We use timestamp instead of commit count because GitHub Actions shallow clones
# don't always have proper git describe output with commit counts
snapshot:
  version_template: "{{ incpatch .Version }}-preview.{{ .Timestamp }}+{{ .ShortCommit }}"

# ============================================================================
# CHANGELOG
# ============================================================================
# Changelog generation
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^build\\(deps\\):"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Performance Improvements"
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

# ============================================================================
# PACKAGE MANAGERS
# ============================================================================

# AUR (Arch User Repository) packages
aurs:
  - name: tinct-bin
    ids:
      - tinct-archive
    homepage: "https://github.com/jmylchreest/tinct"
    description: "Generate colour palettes from images and apply system-wide theming"
    maintainers:
      - "John Mylchreest <jmylchreest@gmail.com>"
    license: MIT
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/tinct-bin.git"
    url_template: "https://github.com/jmylchreest/tinct/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    package: |-
      # bin
      install -Dm755 "./tinct" "${pkgdir}/usr/bin/tinct"

      # license
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/tinct/LICENSE"

      # completions
      mkdir -p "${pkgdir}/usr/share/bash-completion/completions/"
      mkdir -p "${pkgdir}/usr/share/zsh/site-functions/"
      mkdir -p "${pkgdir}/usr/share/fish/vendor_completions.d/"
      install -Dm644 "./completions/tinct.bash" "${pkgdir}/usr/share/bash-completion/completions/tinct"
      install -Dm644 "./completions/_tinct" "${pkgdir}/usr/share/zsh/site-functions/_tinct"
      install -Dm644 "./completions/tinct.fish" "${pkgdir}/usr/share/fish/vendor_completions.d/tinct.fish"

      # sbom
      for sbom in *.sbom.json; do
        if [ -f "$sbom" ]; then
          install -Dm644 "$sbom" "${pkgdir}/usr/share/doc/tinct/sbom.json"
          break
        fi
      done

  # Plugin: random
  - name: tinct-plugin-random-bin
    ids:
      - tinct-plugin-random-archive
    homepage: "https://github.com/jmylchreest/tinct"
    description: "Random color palette generator plugin for Tinct"
    maintainers:
      - "John Mylchreest <jmylchreest@gmail.com>"
    license: MIT
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/tinct-plugin-random-bin.git"
    depends:
      - tinct
    url_template: "https://github.com/jmylchreest/tinct/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
