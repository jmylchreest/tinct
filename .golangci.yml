# golangci-lint configuration for Tinct
# https://golangci-lint.run/usage/configuration/
# Compatible with golangci-lint v2.6.1 (latest)

version: "2"

# Linters configuration
linters:
  # Default set: 'standard' (enabled by default), 'all', or 'none'
  default: none

  # Enable specific linters
  enable:
    # Bugs and correctness
    - errcheck # Check for unchecked errors
    - govet # Reports suspicious constructs
    - ineffassign # Detect ineffectual assignments
    - staticcheck # Go static analysis (includes gosimple in v2)
    - unused # Check for unused constants, variables, functions and types

    # Style and formatting
    - misspell # Find commonly misspelled English words
    - whitespace # Check for trailing whitespace

    # Complexity
    - gocyclo # Check cyclomatic complexity
    - gocognit # Check cognitive complexity
    - nestif # Check deeply nested if statements

    # Performance
    - prealloc # Find slice declarations that could potentially be preallocated

    # Best practices
    - errname # Check error naming conventions
    - errorlint # Find code that will cause problems with the error wrapping
    - goconst # Find repeated strings that could be replaced by a constant
    - gocritic # The most opinionated Go linter
    - goprintffuncname # Check printf-like functions are named with f at the end
    - nolintlint # Ensure nolint directives are properly used
    - revive # Fast, configurable, extensible, flexible, and beautiful linter
    - unconvert # Remove unnecessary type conversions
    - unparam # Find unused function parameters

    # Security
    - gosec # Security problems

    # Comments and documentation
    - godot # Check if comments end in a period

    # Modern Go features
    - gomoddirectives # Manage replace, retract directives in go.mod
    - gomodguard_v2 # Check for blocked dependencies

    # Testing
    - tparallel # Detects inappropriate usage of t.Parallel()

    # Error handling
    - wrapcheck # Check that errors from external packages are wrapped

    # Modern Go features and simplifications
    - modernize # Suggest simplifications using modern Go constructs (NEW in v2.6.0)

  # Linters settings
  settings:
    # Error checking
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Rows).Close
        - (*github.com/spf13/cobra.Command).MarkFlagRequired

    # Cyclomatic complexity
    gocyclo:
      min-complexity: 15

    # Cognitive complexity
    gocognit:
      min-complexity: 30

    # Constants detection
    goconst:
      min-len: 3
      min-occurrences: 3
      # FlagHelp declarations spell the plugin protocol's type vocabulary
      # and rendered defaults inline:
      #   {Name: "count", Type: "int", Default: "32", ...}
      # Those literals mirror the wire field exactly, and a table of flag
      # declarations reads better with them than with constants — a
      # `typeString` indirection would obscure what the protocol actually
      # carries. Excluded rather than extracted.
      ignore-string-values: '^(string|int|bool|float|true|false)$'

    # Go critic
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
      disabled-checks:
        - commentedOutCode
        - whyNoLint
        - hugeParam # 112 bytes for CategorisedColour is acceptable for our use case

    # Security
    gosec:
      excludes:
        - G104 # Audit errors not checked (covered by errcheck)
      config:
        global:
          audit: true

    # Nested if depth
    nestif:
      min-complexity: 10

    # Revive configuration
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    # Static check
    staticcheck:
      checks:
        - all
        - -SA1019 # Allow deprecated packages (we'll handle these explicitly)

    # Unused code
    unused:
      field-writes-are-uses: true
      exported-fields-are-used: false

    # Whitespace
    whitespace:
      multi-if: true
      multi-func: true

    # Error wrapping
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
      ignore-package-globs:
        - github.com/jmylchreest/tinct/*

  # Exclusions configuration
  exclusions:
    # Mode of the generated files analysis
    # Options: strict, lax, disable
    generated: lax

    # Log a warning if an exclusion rule is unused
    warn-unused: true

    # Predefined exclusion rules
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy

    # Excluding configuration per-path, per-linter, per-text and per-source
    rules:
      # Exclude some linters from running on tests files
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - goconst

      # Exclude magic number warnings in tests
      - path: _test\.go
        text: "mnd: Magic number"

      # Exclude some staticcheck messages
      - linters:
          - staticcheck
        text: "SA9003:"

      # Exclude lll issues for long lines with go:generate
      - linters:
          - lll
        source: "^//go:generate "

      # Exclude godot issues for TODO comments
      - linters:
          - godot
        source: "^// TODO"

      # Exclude godot for the standard "// Injected at build time via:"
      # comment that appears next to Version/Commit/Date vars in every
      # plugin's main.go. Adding a period would suggest the comment is a
      # complete sentence; it's actually a label for the ldflag below.
      - linters:
          - godot
        source: "^\\t// Injected at build time via:"

      # Allow blank identifiers in main and init functions
      - path: cmd/
        text: "G104:"
        linters:
          - gosec

      # Allow error shadowing in certain contexts
      - text: 'shadow: declaration of "err"'
        linters:
          - govet

      # Exclude wrapcheck for internal packages
      - path: internal/
        linters:
          - wrapcheck

      # contrib/ plugins legitimately use a `replace github.com/jmylchreest/tinct
      # => ../../../../` directive so the plugin always builds against the
      # current local tinct module (rather than an outdated published version).
      # That's a design choice, not a mistake — silence the linter complaint.
      - path: contrib/
        linters:
          - gomoddirectives

      # contrib/ plugins are external — they can't rely on tinct's internal
      # error wrapping conventions, so wrapcheck false-positives heavily.
      # The plugins still wrap their own errors via fmt.Errorf %w; what
      # wrapcheck flags here is propagating tinct SDK errors verbatim.
      - path: contrib/
        linters:
          - wrapcheck

      # Package names that intentionally shadow stdlib (established naming)
      - text: "var-naming: avoid package names that conflict with Go standard library"
        linters:
          - revive

      # Package names with underscores (established naming)
      - text: "var-naming: don't use an underscore in package name"
        linters:
          - revive

      # Package names that are intentionally generic
      - text: "var-naming: avoid meaningless package names"
        linters:
          - revive

      # Exported names that stutter with package name (public API, can't rename)
      - text: "exported: (type|func) name will be used as"
        linters:
          - revive

      # Struct fields with underscores needed for JSON serialization
      - text: "var-naming: don't use underscores in Go names; struct field"
        linters:
          - revive

      # Package names with underscores (established naming, staticcheck variant)
      - text: "ST1003: should not use underscores in package names"
        linters:
          - staticcheck

# Formatters configuration
formatters:
  # Enable specific formatters
  enable:
    - gofmt # Format code with gofmt

# Issues configuration
issues:
  # Maximum issues count per one linter
  # Set to 0 to disable
  max-issues-per-linter: 0

  # Maximum count of issues with the same text
  # Set to 0 to disable
  max-same-issues: 0

  # Make issues output unique by line
  uniq-by-line: true

  # Show only new issues: if there are unstaged changes or untracked files,
  # only those changes are analyzed, else only changes in HEAD~ are analyzed.
  new: false

# Options for analysis running
run:
  # Timeout for analysis
  timeout: 5m

  # Include test files
  tests: true

  # Go version to target
  go: "1.25"

  # Allow multiple parallel golangci-lint instances
  allow-parallel-runners: true

  # The mode used to evaluate relative paths.
  # gitroot is needed so contrib/-scoped exclusions in `issues.exclusions.rules`
  # still apply when golangci-lint is invoked from inside a contrib/plugins/
  # submodule (each plugin has its own go.mod).
  # Options: gomod, gitroot, cfg, wd
  relative-path-mode: gitroot

# Severity settings
severity:
  # Set default severity
  default: error

  # Severity rules
  rules:
    - linters:
        - dupl
      severity: info
    - linters:
        - goconst
      severity: warning
