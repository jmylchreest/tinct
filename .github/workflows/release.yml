# GitHub Actions workflow for Tinct CI/CD
# Handles testing, linting, and automated releases with GoReleaser

name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      keep_releases:
        description: 'Number of most recent releases to keep visible (default: 10)'
        required: false
        type: number
        default: 10
      keep_prereleases:
        description: 'Number of most recent pre-releases to keep (default: 3)'
        required: false
        type: number
        default: 3

permissions:
  contents: write
  packages: write
  issues: write
  security-events: write # Required for uploading SARIF files to Security tab
  attestations: write # Required for build provenance attestations
  id-token: write # Required for OIDC attestations

jobs:
  # Test job - runs on all pushes and PRs
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Run benchmarks
        run: go test -bench=. -benchmem ./...

      # The contrib plugins are separate Go modules, so the root `./...`
      # above does not reach them. Without this they were never built or
      # tested in CI, and a plugin could be broken by a change to the
      # shared SDK without anything failing.
      - name: Build and test contrib plugin modules
        run: |
          set -euo pipefail
          failed=0
          for mod in $(find contrib -name go.mod | sort); do
            dir="$(dirname "$mod")"
            echo "::group::$dir"
            if ! (cd "$dir" && go build ./... && go test ./...); then
              echo "::error file=$mod::contrib module failed: $dir"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  # Lint job - runs on all pushes and PRs
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      # These three are gates, not reports: continue-on-error made the job
      # report success while golangci-lint was printing "##[error]issues
      # found", so lint was decorative for as long as it has existed.
      #
      # golangci-lint is pinned rather than tracking `latest`, so a new
      # release cannot turn a green branch red without a deliberate bump.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

  # Security scan job
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.29.0
        with:
          args: "-fmt sarif -out gosec-results.sarif -no-fail ./..."
        continue-on-error: true

      - name: Filter SARIF fixes field
        if: always() && hashFiles('gosec-results.sarif') != ''
        run: |
          # Remove the 'fixes' field from SARIF to avoid validation errors
          if [ -f gosec-results.sarif ]; then
            jq 'del(.runs[].results[].fixes)' gosec-results.sarif > gosec-results-filtered.sarif
            mv gosec-results-filtered.sarif gosec-results.sarif
          fi
        continue-on-error: true

      - name: Upload Gosec results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('gosec-results.sarif') != ''
        with:
          sarif_file: "gosec-results.sarif"
        continue-on-error: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -json -format json ./... > govulncheck-results.json || true
        continue-on-error: true

      - name: Display govulncheck results
        if: always() && hashFiles('govulncheck-results.json') != ''
        run: |
          echo "=== govulncheck results ==="
          cat govulncheck-results.json
          echo ""
          echo "=== Summary ==="
          # Show a concise summary of any vulnerabilities found
          if command -v jq &> /dev/null; then
            VULN_COUNT=$(jq '[.vulns // [] | .[] | select(.modules != null)] | length' govulncheck-results.json 2>/dev/null || echo "N/A")
            echo "Vulnerabilities found: $VULN_COUNT"
          fi
        continue-on-error: true

  # Preview release job - runs on main branch pushes (excluding tags)
  preview:
    name: Preview Release
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.0

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TINCT_TELEMETRY_APP_KEY: ${{ secrets.TINCT_TELEMETRY_APP_KEY || vars.TINCT_TELEMETRY_APP_KEY }}
          TINCT_TELEMETRY_SERVER_URL: ${{ secrets.TINCT_TELEMETRY_SERVER_URL || vars.TINCT_TELEMETRY_SERVER_URL }}

      - name: Get version from dist metadata
        id: version
        run: |
          VERSION=$(jq -r '.version' dist/metadata.json)
          # Use the version as the tag (should already include 'v' prefix)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Delete existing preview release if it exists
        continue-on-error: true
        run: |
          gh release delete ${{ steps.version.outputs.tag }} --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build conventional-commits changelog
        id: changelog
        run: |
          # Find the previous proper version tag (vX.Y.Z) so the diff is
          # against the last shipped release rather than the previous
          # snapshot, which would be empty.
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)

          if [ -z "$PREV_TAG" ]; then
            RANGE=""
            echo "No previous tag — building changelog from full history."
          else
            RANGE="${PREV_TAG}..HEAD"
            echo "Building changelog for ${RANGE}"
          fi

          mkdir -p dist
          NOTES_FILE=dist/release-notes.md

          # Group commits by conventional type. Sections with no entries
          # are omitted to keep the body tight.
          {
            echo "Automated preview build from \`main\`."
            echo
            echo "**Commit**: ${GITHUB_SHA}  "
            echo "**Version**: ${{ steps.version.outputs.version }}"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "**Diff**: [${PREV_TAG} → ${{ steps.version.outputs.tag }}](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.sha }})"
              echo
            fi

            for section in "feat:Features:^.*?feat(\\([^)]+\\))?!?:" \
                           "fix:Bug Fixes:^.*?fix(\\([^)]+\\))?!?:" \
                           "perf:Performance:^.*?perf(\\([^)]+\\))?!?:" \
                           "refactor:Refactoring:^.*?refactor(\\([^)]+\\))?!?:"; do
              IFS=: read -r _ title pattern <<< "$section"
              entries=$(git log $RANGE --no-merges --pretty=format:'- %s (%h)' | grep -E "$pattern" || true)
              if [ -n "$entries" ]; then
                echo "## ${title}"
                echo
                echo "$entries"
                echo
              fi
            done

            echo "---"
            echo
            echo "Download the appropriate binary for your system from the assets below."
          } > "$NOTES_FILE"

          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
          echo "----- notes preview -----"
          cat "$NOTES_FILE"

      - name: Create preview release
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            --title "Preview Release ${{ steps.version.outputs.version }}" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}" \
            --prerelease \
            --target main \
            dist/*.tar.gz \
            dist/checksums.txt \
            dist/*.sbom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger plugin repository update (preview)
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_REPO_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            echo "Triggering plugin repository sync for preview release..."
            if gh api repos/jmylchreest/tinct-plugins/dispatches \
              -f event_type=tinct-release \
              -f client_payload[release_type]=preview \
              -f client_payload[version]=${{ steps.version.outputs.tag }}; then
              echo "✓ Successfully triggered plugin repository sync"
            else
              echo "⚠ Failed to trigger plugin repository sync"
              exit 0
            fi
          else
            echo "PLUGIN_REPO_PAT not configured, skipping plugin repository trigger"
          fi

      - name: Prune old preview releases
        run: |
          # Keep at least N most recent preview releases (default: 3, configurable via workflow_dispatch)
          # Also delete any previews older than the most recent tagged release
          MIN_KEEP=${{ github.event.inputs.keep_prereleases || 3 }}

          echo "Finding most recent tagged release..."
          LATEST_TAG_DATE=$(gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease == false)] | sort_by(.createdAt) | reverse | .[0].createdAt' || echo "")

          echo "Latest tagged release date: $LATEST_TAG_DATE"
          echo "Keeping at least $MIN_KEEP preview releases"

          echo "Fetching preview releases to prune..."
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '.[] | select(.isPrerelease == true) | {tag: .tagName, date: .createdAt}' | \
          jq -s 'sort_by(.date) | reverse' | \
          jq -r --arg latest_tag_date "$LATEST_TAG_DATE" --argjson min_keep "$MIN_KEEP" '
            to_entries |
            map(select(
              (.key >= $min_keep) and
              (if $latest_tag_date != "" then .value.date < $latest_tag_date else true end)
            )) |
            .[].value.tag
          ' | \
          while IFS= read -r old_tag; do
            if [ -n "$old_tag" ]; then
              echo "Deleting old preview release: $old_tag"
              gh release delete "$old_tag" --yes || true
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # Release job - only runs on tags
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, security]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.0

      - name: Run GoReleaser
        # GoReleaser generates and uploads SBOMs for all artifacts automatically
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          TINCT_TELEMETRY_APP_KEY: ${{ secrets.TINCT_TELEMETRY_APP_KEY || vars.TINCT_TELEMETRY_APP_KEY }}
          TINCT_TELEMETRY_SERVER_URL: ${{ secrets.TINCT_TELEMETRY_SERVER_URL || vars.TINCT_TELEMETRY_SERVER_URL }}

      - name: Attest build artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/**/*.tar.gz
            dist/**/*.zip

      - name: Delete old releases
        if: success()
        run: |
          # Keep only the N most recent stable releases (default: 10, configurable via workflow_dispatch)
          KEEP_RELEASES=${{ github.event.inputs.keep_releases || 10 }}

          echo "Managing release history..."
          echo "Keep releases: $KEEP_RELEASES"

          # Get all non-prerelease releases sorted by creation date (newest first)
          echo "Fetching all stable releases..."
          RELEASES=$(gh release list --limit 100 --json tagName,isPrerelease,isDraft,createdAt \
            --jq '[.[] | select(.isPrerelease == false)] | sort_by(.createdAt) | reverse')

          # Count total stable releases
          TOTAL_RELEASES=$(echo "$RELEASES" | jq 'length')
          echo "Found $TOTAL_RELEASES stable releases"

          if [ "$TOTAL_RELEASES" -le "$KEEP_RELEASES" ]; then
            echo "Only $TOTAL_RELEASES stable releases found, keeping all"
          else
            # Get releases to delete (those beyond the keep threshold)
            RELEASES_TO_DELETE=$(echo "$RELEASES" | jq -r --argjson keep "$KEEP_RELEASES" '
              .[$keep:] | .[].tagName
            ')

            if [ -n "$RELEASES_TO_DELETE" ]; then
              echo "Releases to delete:"
              echo "$RELEASES_TO_DELETE"

              # Delete each old release
              echo "$RELEASES_TO_DELETE" | while IFS= read -r tag; do
                if [ -n "$tag" ]; then
                  echo "Deleting release $tag..."
                  if gh release delete "$tag" --yes; then
                    echo "Successfully deleted $tag"
                  else
                    echo "Failed to delete $tag"
                  fi
                fi
              done
            else
              echo "No releases need to be deleted"
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Trigger plugin repository update
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_REPO_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            echo "Triggering plugin repository sync via repository_dispatch..."
            if gh api repos/jmylchreest/tinct-plugins/dispatches \
              -f event_type=tinct-release \
              -f client_payload[release_type]=stable \
              -f client_payload[version]=${{ github.ref_name }}; then
              echo "✓ Successfully triggered plugin repository sync"
            else
              echo "⚠ Failed to trigger plugin repository sync"
              exit 0
            fi
          else
            echo "PLUGIN_REPO_PAT not configured, skipping plugin repository trigger"
          fi

  # Version documentation - only runs on stable releases
  version-docs:
    name: Version Documentation
    runs-on: ubuntu-latest
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Creating documentation for version: $VERSION"

      - name: Get previous tag
        id: prev_tag
        run: |
          # Get the previous tag before this one
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -2 | tail -1)
          echo "prev_tag=${PREV_TAG}" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"

      - name: Update changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          DATE=$(date +%Y-%m-%d)
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"

          if ! grep -q "## \[Unreleased\]" CHANGELOG.md; then
            echo "No [Unreleased] section found, skipping changelog update"
            echo "updated=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Promoting [Unreleased] → [$VERSION] (previous tag: ${PREV_TAG:-<none>})"

          # Promote the Unreleased section: rename to [VERSION], append
          # auto-generated conventional-commits entries from PREV_TAG..HEAD
          # under any human-curated content, and re-seed an empty
          # [Unreleased] at the top.
          scripts/promote-unreleased.sh "$VERSION" "$DATE" "$PREV_TAG"

          # Mirror to the docs site source.
          cp CHANGELOG.md docs/docs/changelog.md

          echo "updated=true" >> $GITHUB_OUTPUT

      - name: Check if version already exists
        id: check
        working-directory: docs
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if [ -f versions.json ] && grep -q "\"${VERSION}\"" versions.json; then
            echo "Version ${VERSION} already exists in documentation, skipping"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create documentation version
        if: steps.check.outputs.exists != 'true'
        working-directory: docs
        run: npm run docusaurus docs:version "${{ steps.version.outputs.VERSION }}"

      - name: Commit version files
        if: steps.check.outputs.exists != 'true' || steps.changelog.outputs.updated == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add CHANGELOG.md docs/docs/changelog.md docs/versioned_docs docs/versioned_sidebars docs/versions.json || true
          git diff --staged --quiet || git commit -m "docs: add version ${{ steps.version.outputs.VERSION }}"
          git push

  # Deploy documentation - runs after versioning
  deploy-docs:
    name: Deploy Documentation
    needs: version-docs
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: main
    secrets: inherit
